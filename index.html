<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>資産台帳 | 個人資産管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#efeae0;--paper2:#e7dfcf;--ink:#26333e;--soft:#5c6b73;--faint:#8b9299;--seal:#a2402f;--jade:#3e6c58;--gold:#ad8a3c;--card:#fbf8f1;--shadow:0 6px 22px #26333e18}*{box-sizing:border-box;margin:0;padding:0}html,body{background:#efeae0;color:#26333e;font-family:Noto Sans JP;font-size:16px;font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased}main{background:#efeae0;min-height:100vh}header.header{background:#26333e;color:#fbf8f1;padding:16px 20px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}header.header > div:first-child{display:flex;align-items:center;gap:8px}header.header .title{font-family:Shippori Mincho;font-size:28px;font-weight:800;margin:0 0 -4px}header.header .sub{font-size:12px;color:#8b9299;margin:0}header.header > div:last-child{display:flex;gap:8px}button{border:none;background:transparent;cursor:pointer;padding:8px 12px;border-radius:6px;font-size:14px;transition:all .2s;font-weight:500}button:hover{opacity:.8}button:active{scale:.98}button.btn-primary{background:#3e6c58;color:#fbf8f1}button.btn-secondary{background:#a2402f;color:#fbf8f1}button.btn-accent{background:#ad8a3c;color:#26333e}button.btn-small{padding:4px 8px;font-size:12px}button.pill{background:#e7dfcf;color:#26333e;border-radius:16px}button.pill.active{background:#3e6c58;color:#fbf8f1}.container{padding:16px 16px 32px}section.card{background:#fbf8f1;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px #26333e0a}.hero-label{font-size:13px;color:#8b9299;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}.hero-value{font-family:Shippori Mincho;font-size:32px;font-weight:800;color:#26333e}.section{padding:16px 0;border-bottom:1px solid #e7dfcf}.section span{font-size:14px;font-weight:600;color:#26333e;display:block;margin-bottom:6px}.section small{font-size:12px;color:#8b9299}.list{display:flex;flex-direction:column}.row{display:grid;grid-template-columns:1fr auto;padding:12px 0;border-bottom:1px solid #efefef;cursor:pointer;transition:all .2s;border-radius:6px}.row:hover{background:#f5f2ed}.row:last-child{border-bottom:none}.name{font-size:14px;color:#26333e;font-weight:500}.amount{font-size:14px;font-weight:600;color:#3e6c58;text-align:right}.amount.negative{color:#a2402f}.empty{text-align:center;padding:24px;color:#8b9299;font-size:14px}.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:#26333e80;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.form{background:#fbf8f1;border-radius:12px;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}.form h2{font-family:Shippori Mincho;font-size:24px;margin-bottom:20px;color:#26333e}.form-group{margin-bottom:16px}.form-group label{display:block;font-size:13px;font-weight:600;color:#26333e;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid #e7dfcf;border-radius:6px;font-family:inherit;font-size:14px;background:#fbf8f1;color:#26333e;transition:border .2s}.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#3e6c58;box-shadow:0 0 0 2px #3e6c5820}.form-group textarea{resize:vertical;min-height:80px}.form-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}.balance{margin-bottom:16px}.balance.negative{background:#a2402f08}.balance.positive{background:#3e6c5808}.pill-group{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.pills{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tab-content{animation:fadeIn .2s}.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}.day-header{text-align:center;font-size:11px;font-weight:600;color:#8b9299;padding:8px 0;text-transform:uppercase}.day{background:#e7dfcf;border-radius:8px;padding:12px 6px;text-align:center;font-size:12px;cursor:pointer;transition:all .2s;min-height:60px;display:flex;flex-direction:column;justify-content:space-between}.day:hover{background:#d7cfc0;transform:scale(1.02)}.day.today{background:#3e6c58;color:#fbf8f1}.day.other-month{opacity:.3}.day-date{font-weight:600;margin-bottom:4px}.day-amount{font-size:10px;color:#26333e;font-weight:500}.day-amount.income{color:#3e6c58}.day-amount.expense{color:#a2402f}.chart-container{position:relative;margin:20px 0}.pie-chart{width:100%;max-width:200px;margin:0 auto}.tooltip{position:absolute;background:#26333e;color:#fbf8f1;padding:6px 10px;border-radius:4px;font-size:11px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}.hidden{display:none}.card-config{background:#f5f2ed;padding:12px;border-radius:8px;margin-bottom:16px;border-left:4px solid #ad8a3c}.card-config .config-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.card-config .config-row:last-child{margin-bottom:0}.payment-status{font-size:12px;color:#8b9299;margin-top:8px;padding:8px;background:#fbf8f1;border-radius:6px}@media (max-width:480px){.container{padding:12px 12px 24px}section.card{padding:16px}header.header{grid-template-columns:1fr;gap:8px}header.header .title{font-size:24px}header.header > div:last-child{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{padding:6px 10px;font-size:13px}.form{max-width:100%}}
</style>
</head>
<body><main id="app"></main>
<script>
const KEY='asset-ledger-payment-v3',pad=n=>String(n).padStart(2,'0'),uid=()=>Math.random().toString(36).slice(2)+Date.now(),yen=n=>'¥'+Math.round(Number(n)||0).toLocaleString('ja-JP'),signed=n=>(n>0?'+':'')+yen(n),sum=(a,k)=>a.reduce((s,x)=>s+Number(x[k]||0),0);
const PAYMENTS=['未設定','クレジットカード','口座振替','現金','PayPay','楽天ペイ','その他QR決済','その他'];
let data={},year=new Date().getFullYear(),month=new Date().getMonth(),filter='all',selected='',edit={},currentPaymentTab='all';

function seed(){const d=new Date(),m=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;return{cash:[['普通預金（メインバンク）',850000,{id:'acc1'}],['給与振込口座',320000,{id:'acc2'}],['貯蓄預金',1200000,{id:'acc3'}]].map((x,i)=>({name:x[0],amount:x[1],id:x[2].id,type:'普通預金'})),invest:[['NISA',250000,{type:'NISA'}],['米国株式',180000,{type:'株式'}]].map((x,i)=>({name:x[0],amount:x[1],type:x[2].type,id:uid()})),points:[['楽天ポイント',2450,{service:'楽天'}],['Tポイント',1080,{service:'T-POINT'}]].map((x,i)=>({name:x[0],amount:x[1],service:x[2].service,id:uid()})),tx:[{id:uid(),date:m+'-01',type:'income',amount:450000,category:'給与',payment:PAYMENTS[0],accountId:'acc1',applied:!0},{id:uid(),date:m+'-05',type:'expense',amount:8500,category:'食費',payment:PAYMENTS[2],accountId:'acc1',applied:!0},{id:uid(),date:m+'-08',type:'expense',amount:5200,category:'交通費',payment:PAYMENTS[1],appliedDate:pad(new Date(d.getFullYear(),d.getMonth()+1,15).getDate())}],recurring:[{id:uid(),date:'毎月15日',type:'expense',amount:4800,category:'通信費',payment:PAYMENTS[2],accountId:'acc1'}],cards:[{id:uid(),name:'楽天カード',closingDay:15,paymentDay:10,accountId:'acc1',usedAmount:0,lastClosingDate:null},{id:uid(),name:'JCBカード',closingDay:25,paymentDay:20,accountId:'acc1',usedAmount:0,lastClosingDate:null}]}}

function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(localStorage.getItem('asset-ledger-payment-v2')||'null')}catch(e){}if(!d)d=seed();d.cash=d.cash||[];d.invest=d.invest||[];d.points=d.points||[];d.tx=d.tx||[];d.recurring=d.recurring||[];d.cards=d.cards||[];processPayments();return d}

function save(){localStorage.setItem(KEY,JSON.stringify(data))}

function monthTx(y=year,m=month){const key=`${y}-${pad(m+1)}`,days=new Date(y,m+1,0).getDate();return[...data.tx.filter(x=>x.date.startsWith(key)),...data.recurring.map(x=>{const p=parseInt(x.date);return p>0&&p<=days?{...x,date:`${key}-${pad(p)}`,id:x.id+'-'+key}:null}).filter(Boolean)]}

function dateTx(date){return data.tx.filter(x=>x.date===date)}

function totals(){const a=monthTx();return{income:sum(a.filter(x=>x.type==='income'),'amount'),expense:sum(a.filter(x=>x.type==='expense'),'amount'),cash:sum(data.cash,'amount'),invest:sum(data.invest,'amount'),points:sum(data.points,'amount'),cards:data.cards}}

function paymentTotals(){const a=monthTx().filter(x=>x.type==='expense'),b={};a.forEach(x=>{const p=x.payment||PAYMENTS[0];b[p]=(b[p]||0)+Number(x.amount||0)});return Object.entries(b).filter(([k])=>k!==PAYMENTS[0]).sort((x,y)=>y[1]-x[1])}

function processPayments(){const today=new Date(),y=today.getFullYear(),m=today.getMonth(),d=today.getDate();data.cards.forEach(card=>{const closingDay=card.closingDay,paymentDay=card.paymentDay;if(d===paymentDay){const lastClosed=card.lastClosingDate?new Date(card.lastClosingDate):new Date(y,m-1,closingDay);const periodStart=new Date(lastClosed.getFullYear(),lastClosed.getMonth(),closingDay);periodStart.setMonth(periodStart.getMonth()-1);const nextClose=new Date(y,m,closingDay);const period=`${pad(periodStart.getFullYear())}-${pad(periodStart.getMonth()+1)}-${pad(periodStart.getDate())}`;const usedInPeriod=data.tx.filter(x=>{const xDate=new Date(x.date+' 00:00');return x.payment===PAYMENTS[1]&&x.type==='expense'&&xDate>=periodStart&&xDate<nextClose}).reduce((s,x)=>s+Number(x.amount||0),0);if(usedInPeriod>0){const account=data.cash.find(a=>a.id===card.accountId);if(account){account.amount-=usedInPeriod;card.usedAmount=0;card.lastClosingDate=nextClose.toISOString().split('T')[0]}}}card.usedAmount=data.tx.filter(x=>{const xDate=new Date(x.date);const closingDate=new Date(y,m,closingDay);const lastPeriodStart=new Date(y,m-1,closingDay);return x.payment===PAYMENTS[1]&&x.type==='expense'&&xDate>=lastPeriodStart&&xDate<closingDate}).reduce((s,x)=>s+Number(x.amount||0),0)})}

function closeEdit(){edit={};render()}
function openEdit(sec,id){edit={sec,id};render()}

function render(){const t=totals();document.querySelector('#app').innerHTML=`<header class="header"><div><div class="title">資産台帳</div><div class="sub">個人資産管理プロトタイプ</div></div><div><button class="btn-small btn-primary" onclick="openEdit('cash','new')">+ 口座</button><button class="btn-small btn-secondary" onclick="openEdit('card','new')">+ カード</button><button class="btn-small btn-accent" onclick="openEdit('tx','new')">+ 取引</button></div></header><div class="container">${summary(t)}${cardsSummary(t)}${paymentMethodsView()}${pointsView(t)}${balanceView()}${calendarView()}${edit.sec?editModal():''}`;bindEvents()}

function summary(t){const max=Math.max(t.income,t.expense,1);return`<section class="card"><div class="hero-label">総資産（現金 + 投資 + ポイント）</div><div class="hero-value">${yen(t.cash+t.invest+t.points)}</div></section><section class="card"><div class="hero-grid"><div><div class="hero-label">今月収入</div><div class="hero-value" style="color:#3e6c58">${yen(t.income)}</div></div><div><div class="hero-label">今月支出</div><div class="hero-value" style="color:#a2402f">${yen(t.expense)}</div></div></div></section>`}

function cardsSummary(t){if(!data.cards.length)return'';return`<section class="card"><div class="section"><span>クレジットカード</span><small>利用額と支払い予定</small></div><div class="list">${data.cards.map(card=>{const account=data.cash.find(a=>a.id===card.accountId);const acctName=account?account.name:'未設定';const daysUntilPayment=(()=>{const today=new Date(),payDay=new Date(today.getFullYear(),today.getMonth(),card.paymentDay);if(today>payDay)payDay.setMonth(payDay.getMonth()+1);return Math.ceil((payDay-today)/(1000*60*60*24))})();return row(`${card.name}<br/><small>${acctName} | ${card.closingDay}日締 → ${card.paymentDay}日払い</small>`,`<div>${yen(card.usedAmount)}<br/><small style="color:#8b9299">${daysUntilPayment}日後引落</small></div>`,`openEdit('card','${card.id}')`)}).join('')}</div></section>`}

function pointsView(t){return`<div class="section"><span>ポイント・マイル残高</span><small>合計 ${t.points.toLocaleString('ja-JP')}</small></div><div class="list">${data.points.map(x=>row([x.name,`<small>${x.service||'N/A'}</small>`].join('<br/>'),yen(x.amount),`openEdit('point','${x.id}')`) ).join('')}</div>`}

function paymentMethodsView(){const a=paymentTotals(),total=a.reduce((s,x)=>s+x[1],0)||1;if(!total)return'';const colors=['#3e6c58','#a2402f','#ad8a3c','#3d5a73','#7a4b6b','#5c6b73','#8b9299'],r=52,cx=r+10,cy=r+10,slices=[];let angle=0;a.forEach(([name,amount],idx)=>{const sliceAngle=2*Math.PI*(amount/total);const x1=cx+r*Math.cos(angle);const y1=cy+r*Math.sin(angle);const x2=cx+r*Math.cos(angle+sliceAngle);const y2=cy+r*Math.sin(angle+sliceAngle);const large=sliceAngle>Math.PI?1:0;slices.push(`<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${colors[idx%colors.length]}" opacity="0.9"/>`);angle+=sliceAngle});return`<section class="card"><div class="section"><span>支払い方法別支出</span><small>今月</small></div><div class="chart-container"><svg width="100%" viewBox="0 0 ${2*(cx+20)} ${2*(cy+20)}" class="pie-chart" style="max-width:100%;height:auto">${slices.join('')}</svg></div><div class="list">${a.map(([name,amount])=>`${row(name,yen(amount),'')}`).join('')}</div></section>`}

function balanceView(){const m=new Date(),currentMonth=`${m.getFullYear()}-${pad(m.getMonth()+1)}`,lastMonth=new Date(m.getFullYear(),m.getMonth()-1),lastMonthKey=`${lastMonth.getFullYear()}-${pad(lastMonth.getMonth()+1)}`;const thisMonth=monthTx(m.getFullYear(),m.getMonth()),thisIncome=sum(thisMonth.filter(x=>x.type==='income'),'amount'),thisExpense=sum(thisMonth.filter(x=>x.type==='expense'),'amount'),thisBalance=thisIncome-thisExpense;const previous=monthTx(lastMonth.getFullYear(),lastMonth.getMonth()),prevIncome=sum(previous.filter(x=>x.type==='income'),'amount'),prevExpense=sum(previous.filter(x=>x.type==='expense'),'amount'),prevBalance=prevIncome-prevExpense;return`${thisBalance!==0?`<section class="balance ${thisBalance<0?'negative':'positive'}"><div style="padding:16px"><div class="hero-label">先月の収支</div><div class="hero-value ${prevBalance<0?'negative':''}">${signed(prevBalance)}</div></div></section>`:''}${thisBalance!==0?`<section class="balance ${thisBalance<0?'negative':'positive'}"><div style="padding:16px"><div class="hero-label">今月の収支</div><div class="hero-value ${thisBalance<0?'negative':''}">${signed(thisBalance)}</div></div></section>`:''}`}

function calendarView(){const firstDay=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),daysByDate={};monthTx().forEach(x=>{const d=+x.date.slice(8);daysByDate[d]=(daysByDate[d]||0)+(x.type==='income'?+x.amount:-x.amount)});return`<section class="card"><div class="section"><span>${year}年${month+1}月</span></div><div class="calendar">${['日','月','火','水','木','金','土'].map(x=>`<div class="day-header">${x}</div>`).join('')}${Array(firstDay).fill(null).map(()=>'<div class="day other-month"></div>').join('')}${Array(days).fill(null).map((_,i)=>{const d=i+1,dayKey=`${year}-${pad(month+1)}-${pad(d)}`,today=new Date(),isToday=today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===d,amount=daysByDate[d]||0;return`<div class="day ${isToday?'today':''}" onclick="selected='${dayKey}';render();document.querySelector('.overlay')?.scrollIntoView({behavior:'smooth'})"><div class="day-date">${d}</div><div class="day-amount ${amount>=0?'income':'expense'}">${amount>=0?'+':''}${yen(Math.abs(amount))}</div></div>`}).join('')}</div><div style="display:flex;gap:8px;margin-top:16px"><button class="btn-small btn-primary" onclick="month=Math.max(0,month-1);render()">◀ 前月</button><button class="btn-small btn-primary" onclick="year=new Date().getFullYear();month=new Date().getMonth();render()">今月</button><button class="btn-small btn-primary" onclick="const next=new Date(year,month+1,1);year=next.getFullYear();month=next.getMonth();render()">次月 ▶</button></div></section>${selected?`<div class="overlay" onclick="if(event.target===this){selected='';render()}"><div class="form"><h2>${selected}</h2>${dayTransactions()}<div class="form-actions"><button class="btn-primary" onclick="selected='';render()">閉じる</button></div></div></div>`:''}`}

function dayTransactions(){const a=dateTx(selected),i=sum(a.filter(x=>x.type==='income'),'amount'),e=sum(a.filter(x=>x.type==='expense'),'amount');return a.length?`<div class="list">${a.map(x=>`${row(x.category,x.type==='income'?signed(x.amount):signed(-x.amount),`openEdit('tx','${x.id}')`)}`).join('')}</div><div style="margin-top:16px;padding:12px;background:#e7dfcf;border-radius:8px"><div class="hero-label">合計</div><div class="hero-value">${signed(i-e)}</div></div>`:'<div class="empty">この日の取引はありません</div>'}

function editModal(){const{sec,id}=edit;const isNew=id==='new';return`<div class="overlay" onclick="if(event.target===this)closeEdit()"><div class="form">${sec==='card'?cardForm():`<h2>${['cash','invest','point','tx'].includes(sec)?'編集':'クレジットカード設定'}</h2>${formContent()}<div class="form-actions"><button class="btn-secondary btn-small" onclick="if(confirm('削除しますか？'))removeItem('${sec}','${id}');closeEdit()">削除</button><button class="btn-primary" onclick="submitForm()">保存</button><button class="btn-small" onclick="closeEdit()">キャンセル</button></div>`}</div></div>`}

function cardForm(){const{id}=edit,card=id==='new'?{id:uid(),name:'',closingDay:15,paymentDay:10,accountId:'acc1',usedAmount:0}:data.cards.find(c=>c.id===id)||{id:uid(),name:'',closingDay:15,paymentDay:10,accountId:'acc1',usedAmount:0};return`<h2>${id==='new'?'新規カード':'カード編集'}</h2><div class="card-config"><div class="form-group"><label>カード名</label><input type="text" id="cardName" value="${card.name}" placeholder="楽天カード"/></div><div class="config-row"><div class="form-group"><label>締め日</label><input type="number" id="closingDay" min="1" max="31" value="${card.closingDay}"/></div><div class="form-group"><label>支払日（引落日）</label><input type="number" id="paymentDay" min="1" max="31" value="${card.paymentDay}"/></div></div><div class="form-group"><label>引き落とし口座</label><select id="cardAccount"><option value="">--- 選択 ---</option>${data.cash.map(a=>`<option value="${a.id}" ${card.accountId===a.id?'selected':''}>${a.name}</option>`).join('')}</select></div><div class="payment-status">毎月${card.closingDay}日の締めで、${card.paymentDay}日に口座から自動引き落とされます</div></div><div class="form-actions"><button class="btn-secondary btn-small" onclick="if(id!=='new'&&confirm('削除しますか？'))removeItem('card','${id}');closeEdit()" ${id==='new'?'disabled':''}>${id==='new'?'新規作成':'削除'}</button><button class="btn-primary" onclick="submitCardForm()">保存</button><button class="btn-small" onclick="closeEdit()">キャンセル</button></div>`}

function formContent(){const{sec,id}=edit,arr=sec==='cash'?data.cash:sec==='invest'?data.invest:sec==='point'?data.points:sec==='tx'?data.tx:data.recurring,x=id==='new'?null:arr.find(a=>a.id===id),isTx=sec==='tx';return`<div class="form-group"><label>${sec==='cash'?'口座名':sec==='invest'?'投資商品':sec==='point'?'ポイント名':'カテゴリ'}</label><input type="text" id="name" value="${x?.name||x?.category||''}" placeholder="${sec==='cash'?'メインバンク':sec==='invest'?'NISA':'楽天ポイント':'食費'}"/></div>${sec==='invest'?`<div class="form-group"><label>タイプ</label><select id="type"><option value="NISA" ${x?.type==='NISA'?'selected':''}>NISA</option><option value="株式" ${x?.type==='株式'?'selected':''}>株式</option><option value="その他" ${x?.type==='その他'?'selected':''}>その他</option></select></div>`:sec==='point'?`<div class="form-group"><label>サービス</label><input type="text" id="service" value="${x?.service||''}" placeholder="楽天"/></div>`:''}${sec==='tx'?`<div class="form-group"><label>日付</label><input type="date" id="date" value="${x?.date||new Date().toISOString().split('T')[0]}"/></div><div class="form-group"><label>取引タイプ</label><select id="type"><option value="income" ${x?.type==='income'?'selected':''}>収入</option><option value="expense" ${x?.type==='expense'?'selected':''}>支出</option></select></div><div class="form-group"><label>金額</label><input type="number" id="amount" min="0" value="${x?.amount||0}" placeholder="0"/></div><div class="form-group"><label>支払い方法</label><select id="payment">${PAYMENTS.map((p,i)=>`<option value="${i}" ${x?.payment===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="form-group"><label>連動口座</label><select id="accountId"><option value="">--- なし（ポイント・投資など）---</option>${data.cash.map(a=>`<option value="${a.id}" ${x?.accountId===a.id?'selected':''}>${a.name}</option>`).join('')}</select></div>`:''}<div class="form-group"><label>金額</label><input type="number" id="amount" min="0" value="${x?.amount||0}" placeholder="0" ${sec==='tx'?'style="display:none"':''}/></div>`}

function submitForm(){const{sec,id}=edit,arr=sec==='cash'?data.cash:sec==='invest'?data.invest:sec==='point'?data.points:sec==='tx'?data.tx:data.recurring,x=id==='new'?{id:uid()}:arr.find(a=>a.id===id)||{id:uid()};if(sec==='cash'){x.name=document.getElementById('name').value;x.amount=Number(document.getElementById('amount').value);x.type='普通預金'}else if(sec==='invest'){x.name=document.getElementById('name').value;x.amount=Number(document.getElementById('amount').value);x.type=document.getElementById('type').value}else if(sec==='point'){x.name=document.getElementById('name').value;x.amount=Number(document.getElementById('amount').value);x.service=document.getElementById('service').value}else if(sec==='tx'){const oldAccountId=x.accountId;const newAccountId=document.getElementById('accountId').value;x.date=document.getElementById('date').value;x.type=document.getElementById('type').value;x.amount=Number(document.getElementById('amount').value);x.payment=PAYMENTS[Number(document.getElementById('payment').value)];x.accountId=newAccountId;x.applied=!0;if(oldAccountId&&oldAccountId!==newAccountId){const oldAccount=data.cash.find(a=>a.id===oldAccountId);if(oldAccount)oldAccount.amount+=(x.type==='income'?1:-1)*Number(x.amount)}}if(id==='new')arr.push(x);save();closeEdit()}

function submitCardForm(){const{id}=edit;const card=id==='new'?{id:uid(),name:'',closingDay:15,paymentDay:10,accountId:'acc1',usedAmount:0}:data.cards.find(c=>c.id===id)||{id:uid(),name:'',closingDay:15,paymentDay:10,accountId:'acc1',usedAmount:0};card.name=document.getElementById('cardName').value;card.closingDay=Number(document.getElementById('closingDay').value);card.paymentDay=Number(document.getElementById('paymentDay').value);card.accountId=document.getElementById('cardAccount').value;if(id==='new')data.cards.push(card);save();closeEdit()}

function removeItem(sec,id){const arr=sec==='cash'?data.cash:sec==='invest'?data.invest:sec==='point'?data.points:sec==='tx'?data.tx:sec==='card'?data.cards:data.recurring,x=arr.find(a=>a.id===id);if(x){arr.splice(arr.indexOf(x),1);save()}}

function row(name,amount,onclick=''){return`<div class="row" ${onclick?`onclick="${onclick}"`:''} style="cursor:${onclick?'pointer':'default'}"><div class="name">${name}</div><div class="amount">${amount}</div></div>`}

function bindEvents(){}

data=load();
render();
</script>
</body></html>
