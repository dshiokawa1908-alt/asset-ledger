<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>資産台帳 | 個人資産管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#efeae0;--paper2:#e7dfcf;--ink:#26333e;--soft:#5c6b73;--faint:#8b9299;--seal:#a2402f;--jade:#3e6c58;--gold:#ad8a3c;--blue:#3d5a73;--card:#fbf8f1;--line:#26333e12;--shadow:0 5px 18px #26333e14}*{box-sizing:border-box}html,body{margin:0}body{min-height:100vh;background:linear-gradient(180deg,var(--paper),var(--paper2));font-family:'Noto Sans JP',sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}#app{max-width:460px;margin:auto;padding:20px 16px 48px}.head{display:flex;justify-content:space-between;margin-bottom:20px}.title{font:800 24px 'Shippori Mincho',serif;letter-spacing:.04em}.sub,.meta,.hint{font-size:11px;color:var(--soft)}.stamp{width:54px;height:54px;border-radius:50%;background:var(--seal);color:#fff;display:grid;place-items:center;font-weight:700;transform:rotate(-6deg)}.tabs{display:flex;gap:3px;padding:4px;background:#26333e0d;border-radius:14px;margin-bottom:20px}.tabs button,.pill{flex:1;border:0;border-radius:11px;padding:9px 3px;background:transparent;color:var(--soft);font-size:11.5px}.tabs button.active,.pill.active,.primary{background:var(--ink);color:var(--paper)}.card,.list,.balance,.summary{background:var(--card);border-radius:18px;box-shadow:var(--shadow)}.card{padding:18px 20px}.hero-label,.label{font-size:12px;color:var(--soft)}.hero-value{font:800 34px 'Shippori Mincho',serif;margin:5px 0}.section{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 10px;font-size:13px;font-weight:700;color:var(--soft)}.section small{font-size:11px;font-weight:400;color:var(--faint)}.list{overflow:hidden}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;cursor:pointer}.row:nth-child(even){background:#26333e06}.name{font-size:14px}.amount{font-size:15px;font-weight:700;white-space:nowrap;text-align:right}.pos{color:var(--jade)}.neg{color:var(--seal)}.blue{color:var(--blue)}.tag{font-size:9px;border-radius:99px;padding:2px 7px;background:#ad8a3c29;color:var(--gold);margin-right:5px}.add{width:100%;border:0;border-radius:13px;margin-top:12px;padding:12px;background:#26333e0d;color:var(--soft);font-weight:600}.balance{padding:18px 20px;margin:18px 0;background:linear-gradient(135deg,#3e6c5829,#fbf8f1)}.balance.negative{background:linear-gradient(135deg,#a2402f29,#fbf8f1)}.balance-value{font:800 30px 'Shippori Mincho',serif;margin:4px 0}.balance-sub{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:11px;margin-top:12px}.summary{display:flex;text-align:center;padding:14px 4px}.summary>div{flex:1}.summary b{display:block;margin-top:4px}.pills{display:flex;gap:6px;margin-bottom:10px}.pill{flex:initial;padding:6px 14px;background:#26333e0d}.form{background:var(--card);padding:18px 20px;border-radius:20px;box-shadow:0 6px 20px #26333e20;margin:14px 0}.form-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.form h3{font-size:14px;margin:0}.delete{border:0;border-radius:9px;padding:6px 10px;color:var(--seal);background:#a2402f18}.field{margin:10px 0}.field label{display:block;font-size:11px;color:var(--soft);margin-bottom:5px}.field input,.field select{width:100%;border:0;border-radius:11px;padding:11px 12px;background:#26333e0b;color:var(--ink)}.field input:focus,.field select:focus{outline:2px solid var(--ink)}.actions{display:flex;gap:8px;margin-top:16px}.actions button{flex:1;border:0;border-radius:13px;padding:11px}.ghost{background:#26333e0d}.toggle{display:flex;gap:4px;background:#26333e0b;padding:4px;border-radius:12px}.toggle button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px}.toggle .income{background:var(--jade);color:white}.toggle .expense{background:var(--seal);color:white}.bar{height:8px;border-radius:99px;background:#26333e12;overflow:hidden;margin-top:6px}.fill{height:100%;border-radius:99px}.fill.income{background:#7ca694}.fill.expense{background:#c97a65}.empty{text-align:center;color:var(--faint);font-size:12px;padding:18px}.note{text-align:center;color:var(--faint);font-size:10.5px;margin-top:28px;line-height:1.6}.calendar-nav{display:flex;align-items:center;justify-content:space-between;margin:18px 0}.calendar-nav button{border:0;border-radius:10px;background:#26333e0d;padding:7px 14px;color:var(--ink)}.cal-title{font:700 17px 'Shippori Mincho',serif}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekday{text-align:center;font-size:10px;color:var(--faint);padding-bottom:5px}.day{aspect-ratio:1;border-radius:11px;background:#26333e09;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:11px}.day.today{box-shadow:inset 0 0 0 2px var(--ink)}.day .net{font-size:8.5px;margin-top:3px;font-weight:700}.sheet-bg{position:fixed;inset:0;background:#26333e73;z-index:5}.sheet{position:fixed;z-index:6;bottom:0;left:0;right:0;max-width:460px;margin:auto;max-height:86vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:14px 18px 28px;box-shadow:0 -8px 30px #26333e40}.handle{width:36px;height:4px;border-radius:9px;background:#26333e2e;margin:0 auto 16px}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet-head h3{font:700 18px 'Shippori Mincho',serif;margin:0}.close{border:0;border-radius:50%;width:28px;height:28px}.txn{padding:13px 14px;cursor:pointer}.txn:nth-child(even){background:#26333e06}.txn-top{display:flex;justify-content:space-between}.txn-name{font-size:14px}.pie{display:flex;align-items:center;gap:18px;justify-content:center}.pie svg{flex:none}.legend{font-size:11px;line-height:1.9}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
</style>
</head>
<body><main id="app"></main>
<script>
const KEY='asset-ledger-data-v4',OLD='asset-ledger-data-v3';
const pad=n=>String(n).padStart(2,'0'), uid=()=>Math.random().toString(36).slice(2)+Date.now(), yen=n=>'¥'+Math.round(Number(n)||0).toLocaleString('ja-JP'), signed=n=>(n>0?'+':n<0?'-':'')+yen(Math.abs(n)), today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}, esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), sum=(a,k)=>a.reduce((s,x)=>s+(Number(x[k])||0),0);
function seed(){let [y,m]=today().split('-').map(Number);let mo=`${y}-${pad(m)}`;return{cash:[['普通預金（メインバンク）',850000],['給与振込口座',320000],['貯蓄預金',1200000]].map(x=>({id:uid(),name:x[0],amount:x[1]})),invest:[['eMAXIS Slim 全世界株式','NISA',1250000,180000],['eMAXIS Slim 米国株式(S&P500)','NISA',980000,95000],['トヨタ自動車','株式',420000,-15000],['ソニーグループ','株式',310000,42000]].map(x=>({id:uid(),name:x[0],type:x[1],amount:x[2],gain:x[3]})),points:[['楽天ポイント','ポイント',12000],['Vポイント','ポイント',3500],['ANAマイル','マイル',18500]].map(x=>({id:uid(),name:x[0],type:x[1],amount:x[2]})),tx:[['給与',380000,'income',5],['副業収入',25000,'income',20],['食費',12000,'expense',6],['光熱費',14000,'expense',10],['交際費',18000,'expense',15],['食費',15000,'expense',18],['その他',12000,'expense',22],['食費',15000,'expense',25]].map(x=>({id:uid(),name:x[0],amount:x[1],type:x[2],date:`${mo}-${pad(x[3])}`,memo:'',accountId:'',applied:false})),recurring:[['家賃',95000,2,'口座振替'],['通信費（携帯・ネット）',8500,12,''],['Netflix',1980,27,'サブスク']].map(x=>({id:uid(),name:x[0],amount:x[1],day:x[2],memo:x[3],type:'expense'}))}};
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY)||'null')||JSON.parse(localStorage.getItem(OLD)||'null')}catch(e){}if(!d)d=seed();d.cash=d.cash||[];d.invest=d.invest||[];d.tx=d.tx||d.transactions||[];d.points=d.points||[];d.recurring=d.recurring||[];d.tx=d.tx.map(x=>({...x,accountId:x.accountId||'',applied:!!x.applied}));return d}let data=load();
let tab='summary',filter='all',edit=null,kind='expense',year=new Date().getFullYear(),month=new Date().getMonth(),selected=null;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function monthTx(y=year,m=month){let mk=`${y}-${pad(m+1)}`,actual=data.tx.filter(x=>x.date.startsWith(mk)),days=new Date(y,m+1,0).getDate();return [...actual,...data.recurring.map(r=>({...r,id:'v-'+r.id,date:`${y}-${pad(m+1)}-${pad(Math.min(days,Math.max(1,+r.day||1)))}`,virtual:true}))]}function dateTx(ds){let [y,m]=ds.split('-').map(Number);return monthTx(y,m-1).filter(x=>x.date===ds)}function totals(){let a=monthTx(new Date().getFullYear(),new Date().getMonth());return{cash:sum(data.cash,'amount'),invest:sum(data.invest,'amount'),points:sum(data.points,'amount'),income:sum(a.filter(x=>x.type==='income'),'amount'),expense:sum(a.filter(x=>x.type==='expense'),'amount')}}
function render(){let t=totals();document.querySelector('#app').innerHTML=`<header class="head"><div><div class="title">資産台帳</div><div class="sub">個人資産管理プロトタイプ（手動入力版）</div></div><div class="stamp">${new Date().getMonth()+1}月</div></header><nav class="tabs">${[['summary','サマリー'],['invest','投資'],['cashflow','収支'],['calendar','カレンダー']].map(x=>`<button class="${tab===x[0]?'active':''}" onclick="tab='${x[0]}';edit=null;render()">${x[1]}</button>`).join('')}</nav>${tab==='summary'?summary(t):tab==='invest'?investView():tab==='cashflow'?cashView():calendar()}<div class="note">データはこの端末のブラウザに自動保存されます。項目をタップすると編集・削除できます。</div>${selected?sheet():''}`}
function balance(y,m,label){let a=monthTx(y,m),i=sum(a.filter(x=>x.type==='income'),'amount'),e=sum(a.filter(x=>x.type==='expense'),'amount'),n=i-e;return`<section class="balance ${n<0?'negative':''}"><div class="label">${label}のトータル収支</div><div class="balance-value ${n>=0?'pos':'neg'}">${signed(n)}</div><div class="balance-sub"><span class="label">収入<br><b class="pos">${yen(i)}</b></span><span class="label" style="text-align:right">支出（固定費込み）<br><b class="neg">${yen(e)}</b></span></div></section>`}
function summary(t){let mx=Math.max(t.income,t.expense,1);return`<section class="card"><div class="hero-label">総資産（現金 + NISA + 株式）</div><div class="hero-value">${yen(t.cash+t.invest)}</div><div class="sub">評価額ベース・${new Date().toLocaleDateString('ja-JP')}</div></section><div class="section"><span>ポイント・マイル残高</span><small>合計 ${t.points.toLocaleString('ja-JP')} pt / mile</small></div><div class="list">${data.points.map(x=>row(`${esc(x.name)}<div class="meta"><span class="tag">${esc(x.type)}</span></div>`,`${Number(x.amount).toLocaleString('ja-JP')}<span class="meta"> ${x.type==='マイル'?'mile':'pt'}</span>`,`edit='point:${x.id}';render()`)).join('')||empty()}</div><button class="add" onclick="edit='point:new';render()">＋ ポイント・マイルを追加</button>${balance(new Date().getFullYear(),new Date().getMonth(),'今月')}<div class="section"><span>現金（口座残高）</span><small>${yen(t.cash)}</small></div><div class="list">${data.cash.map(x=>row(esc(x.name),yen(x.amount),`edit='cash:${x.id}';render()`)).join('')||empty()}</div><button class="add" onclick="edit='cash:new';render()">＋ 口座を追加</button><div class="section"><span>投資（評価額）</span><small>${yen(t.invest)}</small></div><div class="list">${data.invest.map(x=>row(esc(x.name),`${yen(x.amount)}<div class="meta ${x.gain>=0?'pos':'neg'}">${signed(x.gain)}</div>`,`edit='invest:${x.id}';render()`)).join('')||empty()}</div><button class="add" onclick="tab='invest';render()">銘柄の内訳を見る・編集する →</button><div class="section"><span>今月の収支</span></div><div class="label">収入　${yen(t.income)}<div class="bar"><div class="fill income" style="width:${t.income/mx*100}%"></div></div></div><br><div class="label">支出　${yen(t.expense)}<div class="bar"><div class="fill expense" style="width:${t.expense/mx*100}%"></div></div></div>${pie()}${edit?form():''}`}
function pie(){let a=monthTx(new Date().getFullYear(),new Date().getMonth()).filter(x=>x.type==='expense'),m={};a.forEach(x=>m[x.virtual?'固定費':x.name]=(m[x.virtual?'固定費':x.name]||0)+Number(x.amount));let cats=Object.entries(m).sort((a,b)=>b[1]-a[1]),total=sum(cats.map(x=>({v:x[1]})),'v');if(!cats.length)return'';let colors=['#3e6c58','#a2402f','#ad8a3c','#3d5a73','#7a4b6b'];let r=52,c=2*Math.PI*r,o=0;let circles=cats.map((x,i)=>{let d=x[1]/total*c,s=`<circle cx="65" cy="65" r="${r}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="22" stroke-dasharray="${d} ${c-d}" stroke-dashoffset="${-o}" transform="rotate(-90 65 65)"/>`;o+=d;return s}).join('');return`<div class="section"><span>支出の内訳</span></div><section class="card pie"><svg width="130" height="130" viewBox="0 0 130 130">${circles}<text x="65" y="68" text-anchor="middle" font-size="11" fill="var(--ink)">${yen(total)}</text></svg><div class="legend">${cats.map((x,i)=>`<div><i style="background:${colors[i%colors.length]}"></i>${esc(x[0])} ${Math.round(x[1]/total*100)}%</div>`).join('')}</div></section>`}
function row(a,b,c){return`<div class="row" onclick="${c}"><div class="name">${a}</div><div class="amount">${b}</div></div>`}function empty(){return'<div class="empty">データがありません</div>'}
function investView(){let a=data.invest.filter(x=>filter==='all'||x.type===filter);return`<div class="pills"><button class="pill ${filter==='all'?'active':''}" onclick="filter='all';render()">すべて</button><button class="pill ${filter==='NISA'?'active':''}" onclick="filter='NISA';render()">NISA</button><button class="pill ${filter==='株式'?'active':''}" onclick="filter='株式';render()">株式</button></div><div class="list">${a.map(x=>row(`${esc(x.name)}<div class="meta"><span class="tag">${esc(x.type)}</span>評価額 ${yen(x.amount)}</div>`,`<span class="${x.gain>=0?'pos':'neg'}">${signed(x.gain)}</span>`,`edit='invest:${x.id}';render()`)).join('')||empty()}</div><button class="add" onclick="edit='invest:new';render()">＋ 銘柄を追加</button>${edit?form():''}`}
function cashView(){let a=monthTx(new Date().getFullYear(),new Date().getMonth()).sort((x,y)=>y.date.localeCompare(x.date)),i=sum(a.filter(x=>x.type==='income'),'amount'),e=sum(a.filter(x=>x.type==='expense'),'amount');return`<div class="summary"><div><span class="sub">収入</span><b class="pos">${yen(i)}</b></div><div><span class="sub">支出</span><b class="neg">${yen(e)}</b></div><div><span class="sub">差引</span><b>${signed(i-e)}</b></div></div><div class="section"><span>固定費（毎月自動計上）</span></div><div class="list">${data.recurring.map(x=>row(`${esc(x.name)}<div class="meta">毎月${x.day}日・${x.type==='income'?'収入':'支出'} ${esc(x.memo||'')}</div>`,`<span class="${x.type==='income'?'pos':'neg'}">${x.type==='income'?'+':'-'}${yen(x.amount)}</span>`,`edit='rec:${x.id}';render()`)).join('')||empty()}</div><button class="add" onclick="edit='rec:new';render()">＋ 固定費を追加</button><div class="section"><span>今月の取引一覧</span><small>タップで編集</small></div><div class="list">${a.map(x=>row(`<div class="meta">${x.date.slice(5)}</div>${x.virtual?'<span class="tag">固定費</span>':''}${esc(x.name)}${x.accountId?`<div class="meta">入出金先：${esc(data.cash.find(c=>c.id===x.accountId)?.name||'')}</div>`:''}`,`<span class="${x.type==='income'?'pos':'neg'}">${x.type==='income'?'+':'-'}${yen(x.amount)}</span>`,x.virtual?`edit='rec:${x.id.slice(2)}';render()`:`edit='tx:${x.id}';kind='${x.type}';render()`)).join('')||empty()}</div><button class="add" onclick="edit='tx:new';kind='expense';render()">＋ 収入・支出を追加</button>${edit?form():''}`}
function calendar(){let first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),a=monthTx(),by={};a.forEach(x=>{let d=+x.date.slice(8);by[d]=(by[d]||0)+(x.type==='income'?+x.amount:-x.amount)});let cells=Array(first).fill(null).concat([...Array(days)].map((_,i)=>i+1));return`${balance(year,month,`${year}年${month+1}月`)}<div class="calendar-nav"><button onclick="month--;if(month<0){month=11;year--}render()">‹ 前月</button><div class="cal-title">${year}年${month+1}月</div><button onclick="month++;if(month>11){month=0;year++}render()">翌月 ›</button></div><div class="grid">${['日','月','火','水','木','金','土'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells.map(d=>d?`<div class="day ${`${year}-${pad(month+1)}-${pad(d)}`===today()?'today':''}" onclick="selected='${year}-${pad(month+1)}-${pad(d)}';render()"><b>${d}</b>${by[d]!==undefined?`<span class="net ${by[d]>=0?'pos':'neg'}">${by[d]>0?'+':''}${Math.round(by[d]/1000)}k</span>`:''}</div>`:'<div></div>').join('')}</div><div class="section"><span>日付をタップすると内訳を確認・入力できます</span></div>`}
function form(){let [sec,raw]=edit.split(':'),arr=sec==='cash'?data.cash:sec==='invest'?data.invest:sec==='point'?data.points:sec==='tx'?data.tx:data.recurring,x=raw==='new'?null:arr.find(a=>a.id===raw),isTx=sec==='tx',isRec=sec==='rec',isPoint=sec==='point';let typ=x?.type||kind;return`<section class="form"><div class="form-head"><h3>${x?'編集':'追加'}</h3>${x?`<button class="delete" onclick="removeItem('${sec}','${x.id}')">削除</button>`:''}</div>${isTx||isRec?`<div class="field"><label>区分</label><div class="toggle"><button class="${typ==='income'?'income':''}" onclick="kind='income';render()">収入</button><button class="${typ==='expense'?'expense':''}" onclick="kind='expense';render()">支出</button></div></div>`:''}${isTx?`<div class="field"><label>日付</label><input id="date" type="date" value="${x?.date||today()}"></div>`:''}<div class="field"><label>${sec==='cash'?'口座名':sec==='invest'?'銘柄名':isPoint?'サービス名':'項目名'}</label><input id="name" value="${esc(x?.name||'')}" placeholder="入力してください"></div>${sec==='invest'?`<div class="field"><label>区分</label><select id="type"><option ${x?.type==='NISA'?'selected':''}>NISA</option><option ${x?.type==='株式'?'selected':''}>株式</option></select></div>`:''}${isPoint?`<div class="field"><label>種類</label><select id="ptype"><option ${x?.type==='ポイント'?'selected':''}>ポイント</option><option ${x?.type==='マイル'?'selected':''}>マイル</option></select></div>`:''}<div class="field"><label>${sec==='cash'?'残高':sec==='invest'?'評価額':isPoint?'残高':'金額'}（円${isPoint?'・pt/mile':''}）</label><input id="amount" type="number" value="${x?.amount??''}"></div>${sec==='invest'?`<div class="field"><label>評価損益（円）</label><input id="gain" type="number" value="${x?.gain??0}"></div>`:''}${isTx?`<div class="field"><label>入出金先の口座（収入・支出を残高に反映）</label><select id="account"><option value="">口座を選択しない</option>${data.cash.map(c=>`<option value="${c.id}" ${x?.accountId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>メモ</label><input id="memo" value="${esc(x?.memo||'')}"></div>`:''}${isRec?`<div class="field"><label>引き落とし日（毎月）</label><input id="day" type="number" min="1" max="31" value="${x?.day||1}"></div><div class="field"><label>メモ</label><input id="memo" value="${esc(x?.memo||'')}"></div>`:''}<div class="actions"><button class="ghost" onclick="edit=null;render()">キャンセル</button><button class="primary" onclick="submit('${sec}','${raw}')">保存</button></div></section>`}
function effect(t){return t.type==='income'?Number(t.amount): -Number(t.amount)}function reverseApplied(t){if(!t.applied||!t.accountId)return;let c=data.cash.find(x=>x.id===t.accountId);if(c)c.amount-=effect(t)}function apply(t){if(!t.accountId)return;let c=data.cash.find(x=>x.id===t.accountId);if(c)c.amount+=effect(t);t.applied=true}
function submit(sec,raw){let arr=sec==='cash'?data.cash:sec==='invest'?data.invest:sec==='point'?data.points:sec==='tx'?data.tx:data.recurring,x=raw==='new'?{id:uid()}:arr.find(a=>a.id===raw);if(sec==='tx'&&raw!=='new')reverseApplied(x);x.name=document.querySelector('#name').value.trim();x.amount=+document.querySelector('#amount').value||0;if(!x.name)return;if(sec==='invest'){x.type=document.querySelector('#type').value;x.gain=+document.querySelector('#gain').value||0}if(sec==='point')x.type=document.querySelector('#ptype').value;if(sec==='tx'){x.type=kind;x.date=document.querySelector('#date').value||today();x.accountId=document.querySelector('#account').value;x.memo=document.querySelector('#memo').value;x.applied=false;apply(x)}if(sec==='rec'){x.type=kind;x.day=Math.min(31,Math.max(1,+document.querySelector('#day').value||1));x.memo=document.querySelector('#memo').value}if(raw==='new')arr.push(x);save();edit=null;render()}
function removeItem(sec,id){let arr=sec==='cash'?data.cash:sec==='invest'?data.invest:sec==='point'?data.points:sec==='tx'?data.tx:data.recurring,x=arr.find(a=>a.id===id);if(sec==='tx')reverseApplied(x);let i=arr.indexOf(x);if(i>=0)arr.splice(i,1);save();edit=null;render()}
function sheet(){let a=dateTx(selected),i=sum(a.filter(x=>x.type==='income'),'amount'),e=sum(a.filter(x=>x.type==='expense'),'amount'),[y,m,d]=selected.split('-');return`<div class="sheet-bg" onclick="selected=null;render()"></div><section class="sheet"><div class="handle"></div><div class="sheet-head"><h3>${m}月${d}日</h3><button class="close" onclick="selected=null;render()">×</button></div><p class="label">収入 <b class="pos">${yen(i)}</b>　支出 <b class="neg">${yen(e)}</b>　差引 <b>${signed(i-e)}</b></p><div class="list">${a.map(x=>`<div class="txn"><div class="txn-top"><span class="txn-name">${x.virtual?'<span class="tag">固定費</span>':''}${esc(x.name)}</span><b class="${x.type==='income'?'pos':'neg'}">${x.type==='income'?'+':'-'}${yen(x.amount)}</b></div>${x.memo?`<div class="meta">${esc(x.memo)}</div>`:''}</div>`).join('')||empty()}</div><button class="add" onclick="edit='tx:new';kind='expense';selected=null;tab='cashflow';render()">＋ この日の収入・支出を追加</button></section>`}
render();
</script></body></html>
