<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>資産台帳 | 資産管理プロトタイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#efeae0;--paper2:#e7dfcf;--ink:#26333e;--soft:#5c6b73;--faint:#8b9299;--seal:#a2402f;--jade:#3e6c58;--gold:#ad8a3c;--card:#fbf8f1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--paper),var(--paper2));font-family:'Noto Sans JP',sans-serif;color:var(--ink)}button,input,select{font:inherit}#app{max-width:460px;margin:auto;padding:20px 16px 48px}.head{display:flex;justify-content:space-between;margin-bottom:20px}.title{font:800 24px 'Shippori Mincho',serif}.sub,.meta,.hint{font-size:11px;color:var(--soft)}.stamp{width:52px;height:52px;border-radius:50%;background:var(--seal);color:#fff;display:grid;place-items:center;font-weight:700;transform:rotate(-6deg)}.tabs{display:flex;gap:3px;padding:4px;background:#26333e12;border-radius:14px;margin-bottom:20px}.tabs button,.pill,.add,.ghost{border:0;border-radius:11px;cursor:pointer;color:var(--soft);background:transparent;padding:9px 4px}.tabs button{flex:1;font-size:11px}.tabs button.active,.primary{background:var(--ink);color:var(--paper)}.card,.list{background:var(--card);border-radius:18px;box-shadow:0 4px 16px #26333e12}.card{padding:18px 20px}.hero-label{font-size:12px;color:var(--soft)}.hero-value{font:800 34px 'Shippori Mincho',serif;margin:5px 0}.section{display:flex;justify-content:space-between;margin:24px 0 10px;font-size:13px;font-weight:700;color:var(--soft)}.list{overflow:hidden}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;cursor:pointer}.row:nth-child(even){background:#26333e06}.name{font-size:14px}.amount{font-size:15px;font-weight:700;white-space:nowrap}.pos{color:var(--jade)}.neg{color:var(--seal)}.add{width:100%;margin-top:12px;background:#26333e0d;font-weight:600}.pills{display:flex;gap:6px;margin-bottom:10px}.pill{padding:6px 14px;background:#26333e0d;font-size:12px}.pill.active{background:var(--ink);color:var(--paper)}.form{background:var(--card);padding:18px 20px;border-radius:20px;box-shadow:0 6px 20px #26333e18;margin:14px 0}.form h3{font-size:14px;margin:0 0 14px}.field{margin:10px 0}.field label{display:block;font-size:11px;color:var(--soft);margin-bottom:5px}.field input,.field select{width:100%;border:0;border-radius:11px;padding:11px 12px;background:#26333e0b;color:var(--ink)}.actions{display:flex;gap:8px;margin-top:16px}.actions button{flex:1;border:0;border-radius:13px;padding:11px;cursor:pointer}.primary{font-weight:700}.summary{display:flex;text-align:center;background:var(--card);border-radius:18px;padding:14px 4px;box-shadow:0 4px 16px #26333e12}.summary>div{flex:1}.summary b{display:block;margin-top:4px}.empty{text-align:center;color:var(--faint);font-size:12px;padding:18px}.note{text-align:center;color:var(--faint);font-size:10px;margin-top:28px}.toggle{display:flex;background:#26333e0b;border-radius:12px;padding:4px}.toggle button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px}.toggle .chosen{background:var(--seal);color:#fff}.toggle .chosen.income{background:var(--jade)}
</style>
</head>
<body><main id="app"></main>
<script>
const key='asset-ledger-data-v2',yen=n=>'¥'+Math.round(Number(n)||0).toLocaleString('ja-JP'),id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random(),today=()=>new Date().toISOString().slice(0,10);
const initial={cash:[['普通預金（メインバンク）',850000],['給与振込口座',320000],['貯蓄預金',1200000]],invest:[['eMAXIS Slim 全世界株式','NISA',1250000,180000],['eMAXIS Slim 米国株式(S&P500)','NISA',980000,95000],['トヨタ自動車','株式',420000,-15000]],tx:[['給与',380000,'income'],['食費',12000,'expense'],['光熱費',14000,'expense']]};
let data=JSON.parse(localStorage.getItem(key)||'null')||{cash:initial.cash.map(x=>({id:id(),name:x[0],amount:x[1]})),invest:initial.invest.map(x=>({id:id(),name:x[0],type:x[1],amount:x[2],gain:x[3]})),tx:initial.tx.map(x=>({id:id(),name:x[0],amount:x[1],type:x[2],date:today()}))};let tab='summary',edit=null,kind='expense';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(key,JSON.stringify(data))}function total(a,k){return a.reduce((s,x)=>s+(+x[k]||0),0)}function tx(){return data.tx}function render(){let cash=total(data.cash,'amount'),invest=total(data.invest,'amount'),income=total(tx().filter(x=>x.type==='income'),'amount'),expense=total(tx().filter(x=>x.type==='expense'),'amount');document.querySelector('#app').innerHTML=`<header class="head"><div><div class="title">資産台帳</div><div class="sub">個人資産管理プロトタイプ（手動入力版）</div></div><div class="stamp">${new Date().getMonth()+1}月</div></header><nav class="tabs">${[['summary','サマリー'],['invest','投資'],['cash','収支']].map(x=>`<button class="${tab===x[0]?'active':''}" onclick="tab='${x[0]}';edit=null;render()">${x[1]}</button>`).join('')}</nav>${tab==='summary'?summary(cash,invest,income,expense):tab==='invest'?investView():cashView()}<div class="note">データはこの端末のブラウザに自動保存されます。</div>`}
function summary(cash,invest,income,expense){return `<section class="card"><div class="hero-label">総資産（現金 + 投資）</div><div class="hero-value">${yen(cash+invest)}</div><div class="sub">評価額ベース・${new Date().toLocaleDateString('ja-JP')}</div></section><div class="section"><span>今月の収支</span><b class="${income-expense>=0?'pos':'neg'}">${income>=expense?'+':'-'}${yen(Math.abs(income-expense))}</b></div><section class="summary"><div><span class="sub">収入</span><b class="pos">${yen(income)}</b></div><div><span class="sub">支出</span><b class="neg">${yen(expense)}</b></div><div><span class="sub">差引</span><b>${income-expense>=0?'+':'-'}${yen(Math.abs(income-expense))}</b></div></section><div class="section"><span>現金（口座残高）</span><span>${yen(cash)}</span></div><div class="list">${data.cash.map(x=>row(x.name,yen(x.amount),`edit='cash:${x.id}';render()`)).join('')||empty()}</div><button class="add" onclick="edit='cash:new';render()">＋ 口座を追加</button><div class="section"><span>投資（評価額）</span><span>${yen(invest)}</span></div><div class="list">${data.invest.map(x=>row(x.name,`${yen(x.amount)}<div class='${x.gain>=0?'pos':'neg'} meta'>${x.gain>=0?'+':''}${yen(x.gain)}</div>`,`edit='invest:${x.id}';render()`)).join('')||empty()}</div><button class="add" onclick="edit='invest:new';render()">＋ 銘柄を追加</button>${edit?form():''}`}
function row(a,b,c){return `<div class="row" onclick="${c}"><div class="name">${esc(a)}</div><div class="amount">${b}</div></div>`}function empty(){return '<div class="empty">データがありません</div>'}
function investView(){return `<div class="section"><span>投資一覧</span></div><div class="list">${data.invest.map(x=>row(`${x.name}<div class="meta">${esc(x.type)}</div>`,`${yen(x.amount)}<div class="${x.gain>=0?'pos':'neg'} meta">${x.gain>=0?'+':''}${yen(x.gain)}</div>`,`edit='invest:${x.id}';render()`)).join('')||empty()}</div><button class="add" onclick="edit='invest:new';render()">＋ 銘柄を追加</button>${edit?form():''}`}
function cashView(){return `<div class="section"><span>取引一覧</span><span>${tx().length}件</span></div><div class="list">${tx().slice().reverse().map(x=>row(`<div class="meta">${x.date}</div>${esc(x.name)}`,`<span class="${x.type==='income'?'pos':'neg'}">${x.type==='income'?'+':'-'}${yen(x.amount)}</span>`,`edit='tx:${x.id}';kind='${x.type}';render()`)).join('')||empty()}</div><button class="add" onclick="edit='tx:new';kind='expense';render()">＋ 収入・支出を追加</button>${edit?form():''}`}
function form(){let [section,raw]=edit.split(':');let x=raw==='new'?null:(section==='cash'?data.cash:section==='invest'?data.invest:data.tx).find(a=>a.id===raw);let isTx=section==='tx';return `<section class="form"><h3>${x?'編集':'追加'}</h3>${isTx?`<div class="field"><label>区分</label><div class="toggle"><button class="${kind==='income'?'chosen income':''}" onclick="kind='income';render()">収入</button><button class="${kind==='expense'?'chosen':''}" onclick="kind='expense';render()">支出</button></div></div><div class="field"><label>日付</label><input id="date" type="date" value="${x?.date||today()}"></div>`:''}<div class="field"><label>${section==='cash'?'口座名':section==='invest'?'銘柄名':'項目名'}</label><input id="name" value="${esc(x?.name||'')}"></div>${section==='invest'?`<div class="field"><label>区分</label><select id="type"><option ${x?.type==='NISA'?'selected':''}>NISA</option><option ${x?.type==='株式'?'selected':''}>株式</option></select></div>`:''}<div class="field"><label>${section==='invest'?'評価額':section==='cash'?'残高':'金額'}（円）</label><input id="amount" type="number" value="${x?.amount||''}"></div>${section==='invest'?`<div class="field"><label>評価損益（円）</label><input id="gain" type="number" value="${x?.gain||0}"></div>`:''}<div class="actions"><button class="ghost" onclick="edit=null;render()">キャンセル</button><button class="primary" onclick="submitForm('${section}','${raw}')">保存</button>${x?`<button onclick="removeItem('${section}','${x.id}')">削除</button>`:''}</div></section>`}
function submitForm(section,raw){let x=raw==='new'?{id:id()}: (section==='cash'?data.cash:section==='invest'?data.invest:data.tx).find(a=>a.id===raw);x.name=document.querySelector('#name').value.trim();x.amount=+document.querySelector('#amount').value||0;if(section==='cash'&&!x.name)return;if(section==='invest'){x.type=document.querySelector('#type').value;x.gain=+document.querySelector('#gain').value||0}if(section==='tx'){x.type=kind;x.date=document.querySelector('#date').value||today()}if(raw==='new')(section==='cash'?data.cash:section==='invest'?data.invest:data.tx).push(x);save();edit=null;render()}
function removeItem(section,item){let a=section==='cash'?data.cash:section==='invest'?data.invest:data.tx;let i=a.findIndex(x=>x.id===item);if(i>=0)a.splice(i,1);save();edit=null;render()}render();
</script></body></html>
