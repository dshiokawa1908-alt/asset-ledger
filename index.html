<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>資産台帳 | 個人資産管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #efeae0;
  --paper2: #e7dfcf;
  --ink: #26333e;
  --soft: #5c6b73;
  --faint: #8b9299;
  --seal: #a2402f;
  --jade: #3e6c58;
  --gold: #ad8a3c;
  --card: #fbf8f1;
  --shadow: 0 6px 22px rgba(38, 51, 62, 0.1);
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html, body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 16px;
  font-weight: 400;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
main {
  background: var(--paper);
  min-height: 100vh;
}
header.header {
  background: var(--ink);
  color: var(--card);
  padding: 16px 20px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
}
header.header > div:first-child {
  display: flex;
  align-items: center;
  gap: 8px;
}
header.header .title {
  font-family: 'Shippori Mincho', serif;
  font-size: 28px;
  font-weight: 800;
  margin: 0 0 -4px;
}
header.header .sub {
  font-size: 12px;
  color: var(--faint);
  margin: 0;
}
header.header > div:last-child {
  display: flex;
  gap: 8px;
}
button {
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 14px;
  transition: all 0.2s;
  font-weight: 500;
  font-family: inherit;
}
button:hover {
  opacity: 0.8;
}
button:active {
  scale: 0.98;
}
button.btn-primary {
  background: var(--jade);
  color: var(--card);
}
button.btn-secondary {
  background: var(--seal);
  color: var(--card);
}
button.btn-accent {
  background: var(--gold);
  color: var(--ink);
}
button.btn-small {
  padding: 4px 8px;
  font-size: 12px;
}
button.pill {
  background: var(--paper2);
  color: var(--ink);
  border-radius: 16px;
}
button.pill.active {
  background: var(--jade);
  color: var(--card);
}
.container {
  padding: 16px 16px 32px;
}
section.card {
  background: var(--card);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.hero-label {
  font-size: 13px;
  color: var(--faint);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}
.hero-value {
  font-family: 'Shippori Mincho', serif;
  font-size: 32px;
  font-weight: 800;
  color: var(--ink);
}
.section {
  padding: 16px 0;
  border-bottom: 1px solid var(--paper2);
}
.section span {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  display: block;
  margin-bottom: 6px;
}
.section small {
  font-size: 12px;
  color: var(--faint);
}
.list {
  display: flex;
  flex-direction: column;
}
.row {
  display: grid;
  grid-template-columns: 1fr auto;
  padding: 12px 0;
  border-bottom: 1px solid #efefef;
  cursor: pointer;
  transition: all 0.2s;
  border-radius: 6px;
}
.row:hover {
  background: #f5f2ed;
}
.row:last-child {
  border-bottom: none;
}
.name {
  font-size: 14px;
  color: var(--ink);
  font-weight: 500;
}
.amount {
  font-size: 14px;
  font-weight: 600;
  color: var(--jade);
  text-align: right;
}
.amount.negative {
  color: var(--seal);
}
.empty {
  text-align: center;
  padding: 24px;
  color: var(--faint);
  font-size: 14px;
}
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(38, 51, 62, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 10;
  overflow-y: auto;
}
.form {
  background: var(--card);
  border-radius: 12px;
  padding: 24px;
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  margin: 16px 0;
}
.form h2 {
  font-family: 'Shippori Mincho', serif;
  font-size: 24px;
  margin-bottom: 20px;
  color: var(--ink);
}
.form-group {
  margin-bottom: 16px;
}
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--paper2);
  border-radius: 6px;
  font-family: inherit;
  font-size: 14px;
  background: var(--card);
  color: var(--ink);
  transition: border 0.2s;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--jade);
  box-shadow: 0 0 0 2px rgba(62, 108, 88, 0.2);
}
.form-group textarea {
  resize: vertical;
  min-height: 80px;
}
.form-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 24px;
}
.balance {
  margin-bottom: 16px;
  border-radius: 12px;
  padding: 20px;
  background: var(--card);
}
.balance.negative {
  background: rgba(162, 64, 47, 0.08);
}
.balance.positive {
  background: rgba(62, 108, 88, 0.08);
}
.hero-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-bottom: 16px;
}
.day-header {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--faint);
  padding: 8px 0;
  text-transform: uppercase;
}
.day {
  background: var(--paper2);
  border-radius: 8px;
  padding: 12px 6px;
  text-align: center;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  min-height: 60px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.day:hover {
  background: #d7cfc0;
  transform: scale(1.02);
}
.day.today {
  background: var(--jade);
  color: var(--card);
}
.day.other-month {
  opacity: 0.3;
}
.day-date {
  font-weight: 600;
  margin-bottom: 4px;
}
.day-amount {
  font-size: 10px;
  color: var(--ink);
  font-weight: 500;
}
.day-amount.income {
  color: var(--jade);
}
.day-amount.expense {
  color: var(--seal);
}
.chart-container {
  position: relative;
  margin: 20px 0;
}
.pie-chart {
  width: 100%;
  max-width: 200px;
  margin: 0 auto;
}
.card-config {
  background: #f5f2ed;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 16px;
  border-left: 4px solid var(--gold);
}
.card-config .config-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}
.payment-status {
  font-size: 12px;
  color: var(--faint);
  margin-top: 8px;
  padding: 8px;
  background: var(--card);
  border-radius: 6px;
}
@media (max-width: 480px) {
  .container {
    padding: 12px 12px 24px;
  }
  section.card {
    padding: 16px;
  }
  header.header {
    grid-template-columns: 1fr;
    gap: 8px;
  }
  header.header .title {
    font-size: 24px;
  }
  header.header > div:last-child {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  button {
    padding: 6px 10px;
    font-size: 13px;
  }
  .form {
    max-width: 100%;
  }
}
</style>
</head>
<body>
<main id="app"></main>
<script>
const KEY = 'asset-ledger-payment-v3';
const pad = n => String(n).padStart(2, '0');
const uid = () => Math.random().toString(36).slice(2) + Date.now();
const yen = n => '¥' + Math.round(Number(n) || 0).toLocaleString('ja-JP');
const signed = n => (n > 0 ? '+' : '') + yen(Math.abs(n));
const sum = (a, k) => a.reduce((s, x) => s + Number(x[k] || 0), 0);

const PAYMENTS = ['未設定', 'クレジットカード', '口座振替', '現金', 'PayPay', '楽天ペイ', 'その他QR決済', 'その他'];

let data = {};
let year = new Date().getFullYear();
let month = new Date().getMonth();
let filter = 'all';
let selected = '';
let edit = {};

function seed() {
  const d = new Date();
  const m = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  return {
    cash: [
      { name: '普通預金（メインバンク）', amount: 850000, id: 'acc1', type: '普通預金' },
      { name: '給与振込口座', amount: 320000, id: 'acc2', type: '普通預金' },
      { name: '貯蓄預金', amount: 1200000, id: 'acc3', type: '普通預金' }
    ],
    invest: [
      { name: 'NISA', amount: 250000, type: 'NISA', id: uid() },
      { name: '米国株式', amount: 180000, type: '株式', id: uid() }
    ],
    points: [
      { name: '楽天ポイント', amount: 2450, service: '楽天', id: uid() },
      { name: 'Tポイント', amount: 1080, service: 'T-POINT', id: uid() }
    ],
    tx: [
      { id: uid(), date: m + '-01', type: 'income', amount: 450000, category: '給与', payment: PAYMENTS[0], accountId: 'acc1', applied: true },
      { id: uid(), date: m + '-05', type: 'expense', amount: 8500, category: '食費', payment: PAYMENTS[2], accountId: 'acc1', applied: true },
      { id: uid(), date: m + '-08', type: 'expense', amount: 5200, category: '交通費', payment: PAYMENTS[1], accountId: 'acc1', applied: false }
    ],
    recurring: [
      { id: uid(), date: '15', type: 'expense', amount: 4800, category: '通信費', payment: PAYMENTS[2], accountId: 'acc1' }
    ],
    cards: [
      { id: uid(), name: '楽天カード', closingDay: 15, paymentDay: 10, accountId: 'acc1', usedAmount: 0, lastClosingDate: null },
      { id: uid(), name: 'JCBカード', closingDay: 25, paymentDay: 20, accountId: 'acc1', usedAmount: 0, lastClosingDate: null }
    ]
  };
}

function load() {
  let d = null;
  try {
    d = JSON.parse(localStorage.getItem(KEY) || 'null') || JSON.parse(localStorage.getItem('asset-ledger-payment-v2') || 'null');
  } catch (e) {}
  if (!d) d = seed();
  d.cash = d.cash || [];
  d.invest = d.invest || [];
  d.points = d.points || [];
  d.tx = d.tx || [];
  d.recurring = d.recurring || [];
  d.cards = d.cards || [];
  return d;
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(data));
}

function processPayments() {
  if (!data.cards || !Array.isArray(data.cards)) return;
  
  const today = new Date();
  const y = today.getFullYear();
  const m = today.getMonth();
  const d = today.getDate();

  data.cards.forEach(card => {
    if (d === card.paymentDay) {
      const closingDay = card.closingDay;
      const lastClosed = card.lastClosingDate ? new Date(card.lastClosingDate) : new Date(y, m - 1, closingDay);
      const periodStart = new Date(lastClosed.getFullYear(), lastClosed.getMonth(), closingDay);
      periodStart.setMonth(periodStart.getMonth() - 1);
      const nextClose = new Date(y, m, closingDay);

      const usedInPeriod = data.tx.filter(x => {
        const xDate = new Date(x.date + ' 00:00');
        return x.payment === PAYMENTS[1] && x.type === 'expense' && xDate >= periodStart && xDate < nextClose;
      }).reduce((s, x) => s + Number(x.amount || 0), 0);

      if (usedInPeriod > 0) {
        const account = data.cash.find(a => a.id === card.accountId);
        if (account) {
          account.amount -= usedInPeriod;
          card.usedAmount = 0;
          card.lastClosingDate = nextClose.toISOString().split('T')[0];
          save();
        }
      }
    }

    const closingDay = card.closingDay;
    const closingDate = new Date(y, m, closingDay);
    const lastPeriodStart = new Date(y, m - 1, closingDay);

    card.usedAmount = data.tx.filter(x => {
      const xDate = new Date(x.date + ' 00:00');
      return x.payment === PAYMENTS[1] && x.type === 'expense' && xDate >= lastPeriodStart && xDate < closingDate;
    }).reduce((s, x) => s + Number(x.amount || 0), 0);
  });
}

function monthTx(y = year, m = month) {
  const key = `${y}-${pad(m + 1)}`;
  const days = new Date(y, m + 1, 0).getDate();
  const txList = data.tx.filter(x => x.date.startsWith(key));
  const recurringList = data.recurring.map(x => {
    const p = parseInt(x.date);
    if (p > 0 && p <= days) {
      return { ...x, date: `${key}-${pad(p)}`, id: x.id + '-' + key };
    }
    return null;
  }).filter(Boolean);
  return [...txList, ...recurringList];
}

function dateTx(date) {
  return data.tx.filter(x => x.date === date);
}

function totals() {
  const a = monthTx();
  return {
    income: sum(a.filter(x => x.type === 'income'), 'amount'),
    expense: sum(a.filter(x => x.type === 'expense'), 'amount'),
    cash: sum(data.cash, 'amount'),
    invest: sum(data.invest, 'amount'),
    points: sum(data.points, 'amount'),
    cards: data.cards
  };
}

function paymentTotals() {
  const a = monthTx().filter(x => x.type === 'expense');
  const b = {};
  a.forEach(x => {
    const p = x.payment || PAYMENTS[0];
    b[p] = (b[p] || 0) + Number(x.amount || 0);
  });
  return Object.entries(b).filter(([k]) => k !== PAYMENTS[0]).sort((x, y) => y[1] - x[1]);
}

function closeEdit() {
  edit = {};
  render();
}

function openEdit(sec, id) {
  edit = { sec, id };
  render();
}

function render() {
  const t = totals();
  let html = '<header class="header"><div><div class="title">資産台帳</div><div class="sub">個人資産管理プロトタイプ</div></div><div>';
  html += '<button class="btn-small btn-primary" onclick="openEdit(\'cash\',\'new\')">+ 口座</button>';
  html += '<button class="btn-small btn-secondary" onclick="openEdit(\'card\',\'new\')">+ カード</button>';
  html += '<button class="btn-small btn-accent" onclick="openEdit(\'tx\',\'new\')">+ 取引</button></div></header><div class="container">';
  html += summary(t);
  html += cardsSummary(t);
  html += paymentMethodsView();
  html += pointsView(t);
  html += balanceView();
  html += calendarView();
  if (edit.sec) html += editModal();
  html += '</div>';
  document.querySelector('#app').innerHTML = html;
  bindEvents();
}

function summary(t) {
  let html = '<section class="card"><div class="hero-label">総資産（現金 + 投資 + ポイント）</div>';
  html += '<div class="hero-value">' + yen(t.cash + t.invest + t.points) + '</div></section>';
  html += '<section class="card"><div class="hero-grid">';
  html += '<div><div class="hero-label">今月収入</div><div class="hero-value" style="color: var(--jade)">' + yen(t.income) + '</div></div>';
  html += '<div><div class="hero-label">今月支出</div><div class="hero-value" style="color: var(--seal)">' + yen(t.expense) + '</div></div>';
  html += '</div></section>';
  return html;
}

function cardsSummary(t) {
  if (!data.cards || !data.cards.length) return '';
  
  let html = '<section class="card"><div class="section"><span>クレジットカード</span><small>利用額と支払い予定</small></div><div class="list">';
  data.cards.forEach(card => {
    const account = data.cash.find(a => a.id === card.accountId);
    const acctName = account ? account.name : '未設定';
    const today = new Date();
    let payDay = new Date(today.getFullYear(), today.getMonth(), card.paymentDay);
    if (today > payDay) {
      payDay.setMonth(payDay.getMonth() + 1);
    }
    const daysUntilPayment = Math.ceil((payDay - today) / (1000 * 60 * 60 * 24));
    html += row(card.name + ' - ' + acctName, yen(card.usedAmount) + ' (' + daysUntilPayment + '日後)', 'openEdit(\'card\',\'' + card.id + '\')');
  });
  html += '</div></section>';
  return html;
}

function pointsView(t) {
  let html = '<div class="section"><span>ポイント・マイル残高</span><small>合計 ' + t.points.toLocaleString('ja-JP') + '</small></div><div class="list">';
  data.points.forEach(x => {
    html += row(x.name + ' (' + (x.service || 'N/A') + ')', yen(x.amount), 'openEdit(\'point\',\'' + x.id + '\')');
  });
  html += '</div>';
  return html;
}

function paymentMethodsView() {
  const a = paymentTotals();
  const total = a.reduce((s, x) => s + x[1], 0) || 1;
  if (!total) return '';

  const colors = ['#3e6c58', '#a2402f', '#ad8a3c', '#3d5a73', '#7a4b6b', '#5c6b73', '#8b9299'];
  const r = 52;
  const cx = r + 10;
  const cy = r + 10;
  const slices = [];
  let angle = 0;

  a.forEach(([name, amount], idx) => {
    const sliceAngle = 2 * Math.PI * (amount / total);
    const x1 = cx + r * Math.cos(angle);
    const y1 = cy + r * Math.sin(angle);
    const x2 = cx + r * Math.cos(angle + sliceAngle);
    const y2 = cy + r * Math.sin(angle + sliceAngle);
    const large = sliceAngle > Math.PI ? 1 : 0;
    slices.push('<path d="M ' + cx + ' ' + cy + ' L ' + x1 + ' ' + y1 + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x2 + ' ' + y2 + ' Z" fill="' + colors[idx % colors.length] + '" opacity="0.9"/>');
    angle += sliceAngle;
  });

  let html = '<section class="card"><div class="section"><span>支払い方法別支出</span><small>今月</small></div><div class="chart-container">';
  html += '<svg width="100%" viewBox="0 0 ' + (2 * (cx + 20)) + ' ' + (2 * (cy + 20)) + '" class="pie-chart" style="max-width:100%;height:auto">';
  html += slices.join('');
  html += '</svg></div><div class="list">';
  a.forEach(([name, amount]) => {
    html += row(name, yen(amount), '');
  });
  html += '</div></section>';
  return html;
}

function balanceView() {
  const m = new Date();
  const thisMonth = monthTx(m.getFullYear(), m.getMonth());
  const thisIncome = sum(thisMonth.filter(x => x.type === 'income'), 'amount');
  const thisExpense = sum(thisMonth.filter(x => x.type === 'expense'), 'amount');
  const thisBalance = thisIncome - thisExpense;

  const lastMonth = new Date(m.getFullYear(), m.getMonth() - 1);
  const previous = monthTx(lastMonth.getFullYear(), lastMonth.getMonth());
  const prevIncome = sum(previous.filter(x => x.type === 'income'), 'amount');
  const prevExpense = sum(previous.filter(x => x.type === 'expense'), 'amount');
  const prevBalance = prevIncome - prevExpense;

  let html = '';
  if (prevBalance !== 0) {
    html += '<section class="balance ' + (prevBalance < 0 ? 'negative' : 'positive') + '">';
    html += '<div class="hero-label">先月の収支</div>';
    html += '<div class="hero-value" style="color: ' + (prevBalance < 0 ? 'var(--seal)' : 'var(--jade)') + '">' + signed(prevBalance) + '</div></section>';
  }
  if (thisBalance !== 0) {
    html += '<section class="balance ' + (thisBalance < 0 ? 'negative' : 'positive') + '">';
    html += '<div class="hero-label">今月の収支</div>';
    html += '<div class="hero-value" style="color: ' + (thisBalance < 0 ? 'var(--seal)' : 'var(--jade)') + '">' + signed(thisBalance) + '</div></section>';
  }
  return html;
}

function calendarView() {
  const firstDay = new Date(year, month, 1).getDay();
  const days = new Date(year, month + 1, 0).getDate();
  const daysByDate = {};

  monthTx().forEach(x => {
    const d = +x.date.slice(8);
    daysByDate[d] = (daysByDate[d] || 0) + (x.type === 'income' ? +x.amount : -x.amount);
  });

  let html = '<section class="card"><div class="section"><span>' + year + '年' + (month + 1) + '月</span></div><div class="calendar">';
  ['日', '月', '火', '水', '木', '金', '土'].forEach(x => {
    html += '<div class="day-header">' + x + '</div>';
  });
  for (let i = 0; i < firstDay; i++) {
    html += '<div class="day other-month"></div>';
  }
  for (let i = 1; i <= days; i++) {
    const dayKey = year + '-' + pad(month + 1) + '-' + pad(i);
    const today = new Date();
    const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === i;
    const amount = daysByDate[i] || 0;
    html += '<div class="day ' + (isToday ? 'today' : '') + '" onclick="selected=\'' + dayKey + '\';render()">';
    html += '<div class="day-date">' + i + '</div>';
    html += '<div class="day-amount ' + (amount >= 0 ? 'income' : 'expense') + '">' + (amount >= 0 ? '+' : '') + yen(Math.abs(amount)) + '</div></div>';
  }
  html += '</div><div style="display:flex;gap:8px;margin-top:16px">';
  html += '<button class="btn-small btn-primary" onclick="month=Math.max(0,month-1);render()">◀ 前月</button>';
  html += '<button class="btn-small btn-primary" onclick="year=new Date().getFullYear();month=new Date().getMonth();render()">今月</button>';
  html += '<button class="btn-small btn-primary" onclick="const next=new Date(year,month+1,1);year=next.getFullYear();month=next.getMonth();render()">次月 ▶</button>';
  html += '</div></section>';
  
  if (selected) {
    html += '<div class="overlay" onclick="if(event.target===this){selected=\'\';render()}"><div class="form"><h2>' + selected + '</h2>';
    html += dayTransactions();
    html += '<div class="form-actions"><button class="btn-primary" onclick="selected=\'\';render()">閉じる</button></div></div></div>';
  }
  return html;
}

function dayTransactions() {
  const a = dateTx(selected);
  const i = sum(a.filter(x => x.type === 'income'), 'amount');
  const e = sum(a.filter(x => x.type === 'expense'), 'amount');

  if (a.length) {
    let html = '<div class="list">';
    a.forEach(x => {
      html += row(x.category, x.type === 'income' ? signed(x.amount) : signed(-x.amount), 'openEdit(\'tx\',\'' + x.id + '\')');
    });
    html += '</div><div style="margin-top:16px;padding:12px;background:var(--paper2);border-radius:8px">';
    html += '<div class="hero-label">合計</div>';
    html += '<div class="hero-value">' + signed(i - e) + '</div></div>';
    return html;
  }
  return '<div class="empty">この日の取引はありません</div>';
}

function editModal() {
  const { sec, id } = edit;
  if (sec === 'card') {
    return '<div class="overlay" onclick="if(event.target===this)closeEdit()"><div class="form">' + cardForm() + '</div></div>';
  }
  let html = '<div class="overlay" onclick="if(event.target===this)closeEdit()"><div class="form"><h2>編集</h2>';
  html += formContent();
  html += '<div class="form-actions">';
  html += '<button class="btn-secondary btn-small" onclick="if(confirm(\'削除しますか?\'))removeItem(\'' + sec + '\',\'' + id + '\');closeEdit()">削除</button>';
  html += '<button class="btn-primary" onclick="submitForm()">保存</button>';
  html += '<button class="btn-small" onclick="closeEdit()">キャンセル</button></div></div></div>';
  return html;
}

function cardForm() {
  const { id } = edit;
  const card = id === 'new'
    ? { id: uid(), name: '', closingDay: 15, paymentDay: 10, accountId: 'acc1', usedAmount: 0 }
    : data.cards.find(c => c.id === id) || { id: uid(), name: '', closingDay: 15, paymentDay: 10, accountId: 'acc1', usedAmount: 0 };

  let html = '<h2>' + (id === 'new' ? '新規カード' : 'カード編集') + '</h2><div class="card-config">';
  html += '<div class="form-group"><label>カード名</label><input type="text" id="cardName" value="' + card.name + '" placeholder="楽天カード"/></div>';
  html += '<div class="config-row">';
  html += '<div class="form-group"><label>締め日</label><input type="number" id="closingDay" min="1" max="31" value="' + card.closingDay + '"/></div>';
  html += '<div class="form-group"><label>支払日</label><input type="number" id="paymentDay" min="1" max="31" value="' + card.paymentDay + '"/></div>';
  html += '</div><div class="form-group"><label>引き落とし口座</label><select id="cardAccount">';
  html += '<option value="">--- 選択 ---</option>';
  data.cash.forEach(a => {
    html += '<option value="' + a.id + '" ' + (card.accountId === a.id ? 'selected' : '') + '>' + a.name + '</option>';
  });
  html += '</select></div><div class="payment-status">毎月' + card.closingDay + '日の締めで、' + card.paymentDay + '日に口座から自動引き落とされます</div></div>';
  html += '<div class="form-actions">';
  html += '<button class="btn-secondary btn-small" onclick="if(confirm(\'削除しますか?\'))removeItem(\'card\',\'' + id + '\');closeEdit()">' + (id === 'new' ? '新規作成' : '削除') + '</button>';
  html += '<button class="btn-primary" onclick="submitCardForm()">保存</button>';
  html += '<button class="btn-small" onclick="closeEdit()">キャンセル</button></div>';
  return html;
}

function formContent() {
  const { sec, id } = edit;
  const arr = sec === 'cash' ? data.cash : sec === 'invest' ? data.invest : sec === 'point' ? data.points : sec === 'tx' ? data.tx : data.recurring;
  const x = id === 'new' ? null : arr.find(a => a.id === id);
  const isTx = sec === 'tx';

  let html = '<div class="form-group"><label>' + (sec === 'cash' ? '口座名' : sec === 'invest' ? '投資商品' : sec === 'point' ? 'ポイント名' : 'カテゴリ') + '</label>';
  html += '<input type="text" id="name" value="' + (x?.name || x?.category || '') + '" placeholder="' + (sec === 'cash' ? 'メインバンク' : sec === 'invest' ? 'NISA' : sec === 'point' ? '楽天ポイント' : '食費') + '"/></div>';

  if (sec === 'invest') {
    html += '<div class="form-group"><label>タイプ</label><select id="type">';
    html += '<option value="NISA" ' + (x?.type === 'NISA' ? 'selected' : '') + '>NISA</option>';
    html += '<option value="株式" ' + (x?.type === '株式' ? 'selected' : '') + '>株式</option>';
    html += '<option value="その他" ' + (x?.type === 'その他' ? 'selected' : '') + '>その他</option></select></div>';
  }

  if (sec === 'point') {
    html += '<div class="form-group"><label>サービス</label>';
    html += '<input type="text" id="service" value="' + (x?.service || '') + '" placeholder="楽天"/></div>';
  }

  if (isTx) {
    html += '<div class="form-group"><label>日付</label>';
    html += '<input type="date" id="date" value="' + (x?.date || new Date().toISOString().split('T')[0]) + '"/></div>';
    html += '<div class="form-group"><label>取引タイプ</label><select id="type">';
    html += '<option value="income" ' + (x?.type === 'income' ? 'selected' : '') + '>収入</option>';
    html += '<option value="expense" ' + (x?.type === 'expense' ? 'selected' : '') + '>支出</option></select></div>';
    html += '<div class="form-group"><label>金額</label>';
    html += '<input type="number" id="amount" min="0" value="' + (x?.amount || 0) + '" placeholder="0"/></div>';
    html += '<div class="form-group"><label>支払い方法</label><select id="payment">';
    PAYMENTS.forEach((p, i) => {
      html += '<option value="' + i + '" ' + (x?.payment === p ? 'selected' : '') + '>' + p + '</option>';
    });
    html += '</select></div><div class="form-group"><label>連動口座</label><select id="accountId">';
    html += '<option value="">--- なし ---</option>';
    data.cash.forEach(a => {
      html += '<option value="' + a.id + '" ' + (x?.accountId === a.id ? 'selected' : '') + '>' + a.name + '</option>';
    });
    html += '</select></div>';
  }

  if (sec !== 'tx') {
    html += '<div class="form-group"><label>金額</label>';
    html += '<input type="number" id="amount" min="0" value="' + (x?.amount || 0) + '" placeholder="0"/></div>';
  }

  return html;
}

function submitForm() {
  const { sec, id } = edit;
  const arr = sec === 'cash' ? data.cash : sec === 'invest' ? data.invest : sec === 'point' ? data.points : sec === 'tx' ? data.tx : data.recurring;
  const x = id === 'new' ? { id: uid() } : arr.find(a => a.id === id) || { id: uid() };

  if (sec === 'cash') {
    x.name = document.getElementById('name').value;
    x.amount = Number(document.getElementById('amount').value);
    x.type = '普通預金';
  } else if (sec === 'invest') {
    x.name = document.getElementById('name').value;
    x.amount = Number(document.getElementById('amount').value);
    x.type = document.getElementById('type').value;
  } else if (sec === 'point') {
    x.name = document.getElementById('name').value;
    x.amount = Number(document.getElementById('amount').value);
    x.service = document.getElementById('service').value;
  } else if (sec === 'tx') {
    x.date = document.getElementById('date').value;
    x.type = document.getElementById('type').value;
    x.amount = Number(document.getElementById('amount').value);
    x.payment = PAYMENTS[Number(document.getElementById('payment').value)];
    x.accountId = document.getElementById('accountId').value;
    x.category = document.getElementById('name').value;
    x.applied = true;
  } else if (sec === 'recurring') {
    x.date = document.getElementById('name').value;
    x.category = document.getElementById('name').value;
    x.amount = Number(document.getElementById('amount').value);
  }

  if (id === 'new') arr.push(x);
  save();
  closeEdit();
}

function submitCardForm() {
  const { id } = edit;
  const card = id === 'new'
    ? { id: uid(), name: '', closingDay: 15, paymentDay: 10, accountId: 'acc1', usedAmount: 0 }
    : data.cards.find(c => c.id === id) || { id: uid(), name: '', closingDay: 15, paymentDay: 10, accountId: 'acc1', usedAmount: 0 };

  card.name = document.getElementById('cardName').value;
  card.closingDay = Number(document.getElementById('closingDay').value);
  card.paymentDay = Number(document.getElementById('paymentDay').value);
  card.accountId = document.getElementById('cardAccount').value;

  if (id === 'new') data.cards.push(card);
  save();
  closeEdit();
}

function removeItem(sec, id) {
  const arr = sec === 'cash' ? data.cash : sec === 'invest' ? data.invest : sec === 'point' ? data.points : sec === 'tx' ? data.tx : sec === 'card' ? data.cards : data.recurring;
  const x = arr.find(a => a.id === id);
  if (x) {
    arr.splice(arr.indexOf(x), 1);
    save();
  }
}

function row(name, amount, onclick) {
  let html = '<div class="row"';
  if (onclick) {
    html += ' onclick="' + onclick + '" style="cursor:pointer"';
  }
  html += '><div class="name">' + name + '</div><div class="amount">' + amount + '</div></div>';
  return html;
}

function bindEvents() {}

data = load();
processPayments();
render();
</script>
</body>
</html>
